name: Sync PR Details from Branch and Commits

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Title and Body from Commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CURRENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Random delimiter so a heredoc never closes if a commit body
          # contains the literal "EOF" on its own line.
          DELIM=$(openssl rand -hex 16)

          {
            echo "PR_BODY<<$DELIM"
            git log --no-merges --format="- %s%n%b%n" "origin/$BASE_REF..HEAD"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

          # Title comes from the first commit's subject line. It already
          # follows the project's "<TICKET> <description>" convention.
          git log --no-merges --reverse --format="%s" \
            "origin/$BASE_REF..HEAD" > "$RUNNER_TEMP/subjects.txt"
          FIRST_SUBJECT=$(head -n 1 "$RUNNER_TEMP/subjects.txt")
          printf 'PR_TITLE=%s\n' "${FIRST_SUBJECT:-$CURRENT_TITLE}" >> "$GITHUB_ENV"

      - name: Update Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: process.env.PR_TITLE,
              body: process.env.PR_BODY,
            });
